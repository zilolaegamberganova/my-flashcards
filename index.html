<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard-board</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <form action="" class="form">
        <input class="text" type="text" placeholder="Yangi vazifa kiriting...">
    </form>

    <div class="board">
        <div class="zone" id="todo">
            <h3>To do</h3>
            <div class="cards-container"></div>
        </div>

        <div class="zone" id="important">
            <h3>Important</h3>
            <div class="cards-container"></div>
        </div>

        <div class="zone" id="accomplished">
            <h3>Accomplished</h3>
            <div class="cards-container"></div>
        </div>

        <div class="zone" id="trash">
            <h3>Trash</h3>
            <div class="cards-container"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
